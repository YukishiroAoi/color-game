<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>色感覚チャレンジ</title>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #20242c;
      --muted: #727887;
      --accent: #635bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef1ff, #f9f9fc);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .game {
      width: min(900px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 18px 60px rgba(38, 48, 90, 0.12);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(24px, 4vw, 36px);
      margin: 0 0 6px;
    }

    .description {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }

    .score-board {
      display: flex;
      gap: 16px;
      text-align: center;
    }

    .score-box {
      min-width: 90px;
      padding: 12px 16px;
      border-radius: 16px;
      background: #f2f3ff;
    }

    .score-box small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .score-box strong {
      display: block;
      color: var(--accent);
      font-size: 25px;
      margin-top: 2px;
    }

    .colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .color-card {
      border: 1px solid #e5e7ee;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
    }

    .color-card h2 {
      font-size: 17px;
      margin: 0;
      padding: 17px 20px;
      border-bottom: 1px solid #e5e7ee;
    }

    .color-preview {
      height: 280px;
      background: #ff0000;
      transition: background 0.1s linear;
    }

    .candidate {
      background: #808080;
    }

    .controls {
      padding: 20px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 70px 1fr 65px;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .control-row label {
      font-weight: 700;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .value {
      font-family: monospace;
      text-align: right;
      color: var(--muted);
    }

    .candidate-code {
      color: var(--muted);
      font-family: monospace;
      text-align: center;
      margin: 4px 0 16px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .main-button {
      width: 100%;
      background: var(--accent);
      color: white;
    }

    .main-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      min-height: 70px;
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f7f7fb;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .result strong {
      color: var(--accent);
      font-size: 30px;
    }

    .hint {
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .game {
        padding: 20px;
        border-radius: 20px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .score-board {
        width: 100%;
      }

      .score-box {
        flex: 1;
      }

      .colors {
        grid-template-columns: 1fr;
      }

      .color-preview {
        height: 190px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <div>
        <h1>色感覚チャレンジ</h1>
        <p class="description">
          左のお題と同じ色を、右側で目分量で作ってください。
        </p>
      </div>

      <div class="score-board">
        <div class="score-box">
          <small>ラウンド</small>
          <strong id="round">1</strong>
        </div>
        <div class="score-box">
          <small>合計点</small>
          <strong id="totalScore">0</strong>
        </div>
      </div>
    </header>

    <section class="colors">
      <div class="color-card">
        <h2>お題の色</h2>
        <div id="targetColor" class="color-preview"></div>
      </div>

      <div class="color-card">
        <h2>あなたの色</h2>
        <div id="candidateColor" class="color-preview candidate"></div>

        <div class="controls">
          <div class="control-row">
            <label for="red">赤</label>
            <input id="red" type="range" min="0" max="255" value="128" />
            <span id="redValue" class="value">128</span>
          </div>

          <div class="control-row">
            <label for="green">緑</label>
            <input id="green" type="range" min="0" max="255" value="128" />
            <span id="greenValue" class="value">128</span>
          </div>

          <div class="control-row">
            <label for="blue">青</label>
            <input id="blue" type="range" min="0" max="255" value="128" />
            <span id="blueValue" class="value">128</span>
          </div>

          <p id="candidateCode" class="candidate-code">RGB(128, 128, 128)</p>

          <button id="judgeButton" class="main-button">
            この色で判定する
          </button>
        </div>
      </div>
    </section>

    <div id="result" class="result">
      色を調整して「この色で判定する」を押してください。
    </div>

    <p class="hint">
      判定後は正解の色が表示されます。次のラウンドで再挑戦できます。
    </p>
  </main>

  <script>
    const targetColor = document.getElementById("targetColor");
    const candidateColor = document.getElementById("candidateColor");
    const candidateCode = document.getElementById("candidateCode");
    const result = document.getElementById("result");
    const judgeButton = document.getElementById("judgeButton");

    const red = document.getElementById("red");
    const green = document.getElementById("green");
    const blue = document.getElementById("blue");

    const redValue = document.getElementById("redValue");
    const greenValue = document.getElementById("greenValue");
    const blueValue = document.getElementById("blueValue");

    const roundLabel = document.getElementById("round");
    const totalScoreLabel = document.getElementById("totalScore");

    let target = {};
    let round = 1;
    let totalScore = 0;
    let judged = false;

    function randomColor() {
      return {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
      };
    }

    function rgbString(color) {
      return rgb(${color.r}, ${color.g}, ${color.b});
    }

    function getCandidate() {
      return {
        r: Number(red.value),
        g: Number(green.value),
        b: Number(blue.value)
      };
    }

    function updateCandidate() {
      const candidate = getCandidate();

      candidateColor.style.background = rgbString(candidate);
      candidateCode.textContent =
        RGB(${candidate.r}, ${candidate.g}, ${candidate.b});

      redValue.textContent = candidate.r;
      greenValue.textContent = candidate.g;
      blueValue.textContent = candidate.b;
    }

    function setRandomCandidate() {
      const color = randomColor();

      red.value = color.r;
      green.value = color.g;
      blue.value = color.b;

      updateCandidate();
    }

    function calculateScore(candidate) {
      const distance = Math.sqrt(
        Math.pow(target.r - candidate.r, 2) +
        Math.pow(target.g - candidate.g, 2) +
        Math.pow(target.b - candidate.b, 2)
      );

      const maxDistance = Math.sqrt(3 * Math.pow(255, 2));
      const accuracy = Math.max(0, 1 - distance / maxDistance);

      return {
        score: Math.round(accuracy * 1000),
        distance
      };
    }

    function newRound() {
      target = randomColor();
      targetColor.style.background = rgbString(target);

      setRandomCandidate();

      judged = false;
      judgeButton.disabled = false;
      judgeButton.textContent = "この色で判定する";

      result.innerHTML =
        "色を調整して「この色で判定する」を押してください。";

      roundLabel.textContent = round;
    }

    function judge() {
      if (judged) {
        round++;
        newRound();
        return;
      }

      const candidate = getCandidate();
      const outcome = calculateScore(candidate);

      totalScore += outcome.score;
      totalScoreLabel.textContent = totalScore;

      const difference = Math.round(outcome.distance);

      let message;

      if (outcome.score >= 980) {
        message = "完璧！色の見分けがとても正確！。";
      } else if (outcome.score >= 900) {
        message = "すごい！かなり近い色です。";
      } else if (outcome.score >= 700) {
        message = "いい感じです！もう少し近づけられそう！";
      } else {
        message = "まだ伸びしろアリ！次の色に挑戦!";
      }

      result.innerHTML = `
        ${message}<br>
        <strong>${outcome.score}点</strong>
        <span style="font-size:14px;color:#727887;">
          （色の距離: ${difference}）
        </span>
      `;

      judged = true;
      judgeButton.textContent = "次の色へ";
    }

    [red, green, blue].forEach(slider => {
      slider.addEventListener("input", updateCandidate);
    });

    judgeButton.addEventListener("click", judge);

    newRound();
  </script>
</body>
</html>
